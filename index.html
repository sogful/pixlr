    <script>
        (function() {
            var blockedprefixes = ["/api/ai/", "/api/aif/", "/api/font/google", "/api/assets/"]
            var stubbedprefixes = ["/api/geoip/", "/api/country/", "/checkout/products/"]
            var originalfetch = window.fetch
            window.fetch = function(input, init) {
                var url = typeof input === "string" ? input : (input && input.url) || ""
                var path = url
                try {path = new URL(url, location.href).pathname} catch (e) {}
                if (blockedprefixes.some(function(p) {return path.startsWith(p)})) {
                    document.dispatchEvent(new CustomEvent("notification", {detail: "Pixlr's AI service is unavailable here..."}))
                    return Promise.reject(new Error("blocked " + path))
                }
                if (stubbedprefixes.some(function(p) {return path.startsWith(p)})) {
                    return Promise.resolve(new Response(JSON.stringify({status: false, data: null}), {status: 200, headers: {"content-type": "application/json"}}))
                }
                return originalfetch.call(this, input, init)
            }
        })()
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));

        if ('caches' in window) {
            caches.keys().then(keys => keys.forEach(k => {
                if (k !== 'pixlr-backup') caches.delete(k);
            }));
        }
    </script>

    <script>
        (function () {
            var bar = document.querySelector('.header-wide-notification');
            if (!bar) return;
            var DISMISS_KEY = 'notice-bar-dismissed';
            if (sessionStorage.getItem(DISMISS_KEY)) { bar.remove(); return; }
            var apply = function () {
                document.documentElement.style.setProperty('--notice-bar-height', bar.offsetHeight + 'px');
            };
            apply();
            window.addEventListener('resize', apply);
            var close = bar.querySelector('.header-wide-notification-close');
            if (close) {
                close.addEventListener('click', function () {
                    sessionStorage.setItem(DISMISS_KEY, '1');
                    bar.remove();
                });
            }
        })();
    </script>
